server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: fintech_app
  profiles:
    active: ${SPRING_PROFILE:dev}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads/extratos}

# Automação de extratos (N8N + IA). O backend empurra o PDF para o webhook e o N8N
# devolve o resultado em PATCH /extratos/{id}/status e POST /extratos/{id}/callback.
#
# Do outro lado (variáveis de ambiente do n8n) precisam bater:
#   FINTECH_API_URL    = http://localhost:8082   (onde esta API responde)
#   INTERNAL_API_KEY   = mesmo valor de n8n.internal-api-key
#   N8N_CALLBACK_SECRET= mesmo valor de n8n.callback-secret
#
# Sem INTERNAL_API_KEY/N8N_CALLBACK_SECRET configurados a verificação é pulada
# (com aviso no log) para não travar o desenvolvimento local.
n8n:
  enabled: ${N8N_ENABLED:true}
  webhook-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/extratos/processar}
  internal-api-key: ${INTERNAL_API_KEY:}
  callback-secret: ${N8N_CALLBACK_SECRET:}
  timeout-ms: ${N8N_TIMEOUT_MS:10000}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      type:
        descriptor:
          sql:
            BasicBinder: TRACE
