# ==============================================================================
#  nginx do container "frontend".
#
#  Faz duas coisas:
#    1) serve o build estático do Vite como SPA (qualquer rota cai no index.html)
#    2) espelha o proxy do vite.config.js: /api/* → http://backend:8082/*
#
#  Com isso, navegador e API ficam na MESMA origem (localhost:3000) e o problema
#  de CORS simplesmente não existe — o backend não tem nenhuma configuração de
#  CORS hoje, então essa escolha não é cosmética, é o que faz funcionar.
# ==============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # spring.servlet.multipart.max-file-size = 10MB. Damos folga para o overhead
    # do multipart; sem isso o nginx corta o upload com 413 antes de chegar na API.
    client_max_body_size 12m;

    # ── API ──────────────────────────────────────────────────────────────────
    # A barra final em proxy_pass REMOVE o prefixo /api, exatamente como o
    # rewrite `path.replace(/^\/api/, "")` do vite.config.js.
    #   /api/extratos/upload  →  http://backend:8082/extratos/upload
    location /api/ {
        proxy_pass         http://backend:8082/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization: Bearer <token> do axios passa adiante sem alteração.

        # Upload de extrato + espera do backend pelo n8n pode passar de 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;   # streama o upload em vez de bufferizar tudo
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # react-router-dom faz roteamento no cliente: /transacoes não é um arquivo,
    # precisa devolver o index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (dist/assets/*.js?v=abc) podem ser cacheados forte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip             on;
    gzip_types       text/plain text/css application/json application/javascript
                     application/xml image/svg+xml;
    gzip_min_length  1024;
}
